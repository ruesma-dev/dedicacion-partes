# config/config.yaml
# Parámetros funcionales del microservicio dedicacion-api.
#
# Las consultas se lanzan contra Sigrid a través del sigrid-api
# (POST /api/sql/read). Deben devolver EXACTAMENTE los alias indicados,
# el mapeo se hace por nombre de columna, no por posición.
#
# Usa GET /api/v1/sync/preview para validar los resultados (totales,
# muestra, categorías y estados incluidos/excluidos) ANTES de sincronizar.

sync:
  empleados:
    # Alias obligatorios: ide, nombre, empresa (sin ellos el sync falla sin
    #                     persistir nada, F-023 R6 / F-026 R5)
    # Alias que se guardan: cod, dni, categoria, fecha_baja
    # Alias del filtro:    cod_hora_mes, importe_mes, cif, estado_recurso,
    #                     baja_laboral
    #
    # EL TRABAJADOR ES EL RECURSO (F-026, decisión del humano del
    # 2026-10-01: «no debe buscar por empleado sino por recurso»). La consulta
    # parte de `dbo.res` (recurso) unido a su `con` (`rcon`, misma ide) y se
    # queda con los de clase PERSONA (`res.cla = 1`; 0 consumo, 2 medio). Una
    # fila por recurso: `ide` es `res.ide`, la clave del trabajador en la
    # base `dedicacion` y el recurso que la API manda al transfer
    # (docs/ARCHITECTURE.md#regla-recurso). `cod`, `nombre` y `empresa`
    # salen del concepto del RECURSO (decisión D6).
    #
    # La FICHA DE EMPLEADO es opcional: `LEFT JOIN dbo.emp` por
    # `res.conide` («Empleado asociado»), que solo aporta el DNI y la baja
    # laboral. Un recurso sin ficha (Eusebio Vindel Duro, `1-MO/0772`) entra
    # con `dni` NULL; `cif` (`res.cif`) es el documento del propio recurso,
    # solo para el aviso de posible misma persona del preview.
    #
    # CRITERIO PRINCIPAL: solo entran los RECURSOS con CÓDIGO DE HORA
    # MENSUAL (auxhor.cod LIKE 'M%': MENC, MCAP, MJEFO…), que son los que
    # se registran por porcentaje en el parte de trabajo. Es el mismo
    # criterio que aplica porcentajes-transfer (regla P1), así que lo que
    # se captura y lo que se registra coinciden. Si el recurso no tiene
    # ninguno, cod_hora_mes viene NULL y el servicio descarta la fila (el
    # preview los cuenta como "sin código de hora mensual").
    #
    # EMPRESA: se sincronizan TODAS las empresas; la de cada trabajador es
    # la del recurso (`rcon.emp`). Dos recursos de la misma persona son dos
    # trabajadores, cada uno en su empresa (F-026 D2): no se fusionan.
    #
    # BAJA (F-026 D3): `fecha_baja` es `con.fecbaj` del recurso, con 0 como
    # NULL. Sin WHERE de actividad: el servicio conserva los recursos sin
    # baja o con baja desde la ventana de bajas (mes anterior al sync o el
    # periodo ABIERTO más antiguo) y el cuadrante y el registro deciden por
    # mes. `baja_laboral` (fecbaj del último emphis) solo se cuenta.
    sql: |
      SELECT res.ide      AS ide,
             rcon.cod     AS cod,
             rcon.res     AS nombre,
             emp.dni      AS dni,
             res.cif      AS cif,
             rcon.emp     AS empresa,
             tip.res      AS categoria,
             COALESCE(rest.res, CAST(rcon.est AS VARCHAR(16))) AS estado_recurso,
             NULLIF(rcon.fecbaj, 0) AS fecha_baja,
             uh.fecbaj    AS baja_laboral,
             hm.cod       AS cod_hora_mes,
             hm.pre       AS importe_mes
      FROM dbo.res AS res
      JOIN dbo.con AS rcon ON rcon.ide = res.ide
      LEFT JOIN dbo.emp AS emp ON emp.ide = res.conide AND res.conide > 0
      OUTER APPLY (
          SELECT TOP 1 h.fecbaj
          FROM dbo.emphis AS h
          WHERE h.empide = emp.ide
          ORDER BY h.fec DESC, h.ide DESC
      ) AS uh
      LEFT JOIN dbo.conest AS rest
             ON rest.tip = rcon.tip AND rest.est = rcon.est
      LEFT JOIN dbo.auxrestip AS tip ON tip.ide = res.restipide
      OUTER APPLY (
          SELECT TOP 1 ah.cod AS cod, rh.pre AS pre
          FROM dbo.reshor AS rh
          JOIN dbo.auxhor AS ah ON ah.ide = rh.horide
          WHERE rh.reside = res.ide AND ah.cod LIKE 'M%'
          ORDER BY ah.cod
      ) AS hm
      WHERE res.cla = 1
      ORDER BY rcon.emp, rcon.res, res.ide

    # Estado del RECURSO (F-023). `res` no tiene estado propio: es el de su
    # fila de `con` (misma ide). Campos, según azure-apps/sigrid_tablas.md:
    #   - con.est «Estado», Entero (l. 5657), con su literal en `conest`
    #     por tip + est -> res (l. 6083-6089): alias `estado_recurso`;
    #   - con.fecbaj «Fecha baja», Entero tipo fecha (l. 5658): alias
    #     `fecha_baja` (0 = sin baja, llega como NULL).
    # El tipo 33 (recurso) no tiene estados en `conest`, así que
    # `estado_recurso` llega siempre como el número de con.est en texto.
    filtro_estado_recurso: true
    # VACÍA A PROPÓSITO: para recursos no hay literales en `conest`. NO meter
    # «BAJA» ni «2»: son el estado del EMPLEADO (tipo 43), no del recurso. Y
    # la comparación es por subcadena normalizada: un número casaría otros
    # («1» casa «10» y «21»).
    estados_recurso_excluidos: []
    # true = fuera el recurso con fecha de baja ANTERIOR a la ventana de bajas
    # (F-026 D3, sustituye a `excluir_recurso_con_fecha_baja` de F-023). El
    # de baja en la ventana entra con su `fecha_baja` y solo cuenta en los
    # meses en que aún estaba de alta. El preview cuenta los descartes en
    # empleados.excluidos_por_estado_recurso bajo «(baja anterior a la
    # ventana)» y publica la ventana en empleados.ventana_baja.
    excluir_baja_anterior_a_ventana: true

    # Solo recursos con código de hora mensual (M*). Es EL filtro bueno:
    # deja fuera peones, oficiales y cualquiera que no vaya por porcentaje.
    filtro_codigo_mes: true

    # Solo se sincronizan los empleados cuya categoría (auxrestip.res)
    # esté en esta lista. Comparación normalizada: sin acentos, sin
    # mayúsculas, espacios colapsados. El preview lista las categorías
    # excluidas con su recuento para poder ampliar la lista.
    # Filtro adicional por categoría (auxrestip.res). Desactivado: el
    # código de hora mensual ya es el criterio correcto. Se conserva la
    # lista por si en algún momento hace falta restringir más.
    filtro_categorias: false
    categorias_incluidas:
      - "Administrativa"
      - "Administrativo"
      - "Auxiliar Administrativo"
      - "Auxiliar Administrativa"
      - "Aydte. Coord. Proyectos"
      - "Capataz"
      - "Delegado Andalucía"
      - "Encargado"
      - "Encargada"
      - "Jefa de Obra"
      - "Jefe de Obra"
      - "Jefa de Producción"
      - "Jefe de Producción"
      - "Jefe de Grupo"
      - "Oficial 2 Administrativa"
      - "Oficial 2 Administrativo"
      - "Oficial 2ª Administrativa"
      - "Oficial 2ª Administrativo"
      - "Respon. Compras Instal."
      - "Técnica de Prevención"
      - "Técnico de Prevención"
      - "Técnica Prevención"
      - "Técnico Prevención"
      - "Técnico"
      - "Técnica"
      - "Técnico de Obra"
      - "Técnico Instalaciones"
      - "Técnico Organización 2ª"
      - "Técnico Postventa"

  obras:
    # Alias obligatorios: ide, cod, empresa, descripcion, estado_sigrid
    # El estado legible sale de conest (con.tip + con.est → conest.res).
    # `empresa` es el con.emp de la ficha (F-023): un mismo código en dos
    # empresas son dos obras distintas, cada una con su ide.
    sql: |
      SELECT obr.ide                                        AS ide,
             con.cod                                        AS cod,
             con.emp                                        AS empresa,
             con.res                                        AS descripcion,
             COALESCE(est.res, CAST(con.est AS VARCHAR(16))) AS estado_sigrid
      FROM dbo.obr AS obr
      JOIN dbo.con AS con ON con.ide = obr.ide
      LEFT JOIN dbo.conest AS est
             ON est.tip = con.tip AND est.est = con.est
      ORDER BY con.emp, con.cod

    # Se excluyen las obras cuyo estado contenga (normalizado) alguno de
    # estos literales. Ajustar con los estados reales que muestre el
    # preview (obras.excluidas_por_estado).
    filtro_estados: true
    estados_excluidos:
      - "terminada"
      - "terminado"
      - "cerrada"
      - "cerrado"
      - "liquidada"
      - "liquidado"
      - "anulada"
      - "anulado"

  empresas:
    # Catálogo de empresas de Sigrid (F-032): tabla `auxemp`, campos según
    # azure-apps/sigrid_tablas.md. Se guarda en la tabla `empresa` de la BBDD
    # y de ahí sale el nombre del selector del cuadrante.
    # Alias obligatorios: numemp, nombre.  Alias opcionales: cod, fecbaj, desact
    #   - numemp «Número de Empresa», Entero, único: es lo que casa con con.emp;
    #   - res «Resumen», Texto 48: el nombre;
    #   - fecbaj «Fecha baja», Entero tipo fecha (0 = sin baja);
    #   - desact «Desactivada 0no 1si», Entero.
    # Sin WHERE: entran también las de baja o desactivadas. Una de baja con
    # trabajadores activos se enseña en el selector marcada «(de baja)»,
    # nunca oculta (decisión del humano del 2026-10-01).
    sql: |
      SELECT aux.numemp AS numemp,
             aux.cod    AS cod,
             aux.res    AS nombre,
             aux.fecbaj AS fecbaj,
             aux.desact AS desact
      FROM dbo.auxemp AS aux
      ORDER BY aux.numemp

export:
  # Prefijo con el que se exportan las líneas de postventa, para mantener
  # la compatibilidad con la plantilla Excel actual (códigos "Postv-XXX").
  prefijo_postventa: "Postv-"
  # Lleva la empresa elegida en el selector (F-024, R15).
  nombre_fichero: "dedicacion_{anio}{mes:02d}_emp{empresa}.xlsx"
